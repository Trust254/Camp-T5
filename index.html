lign:center;font-size:12px;color:var(--muted);margin-top:14px}.link{border:0;background:none;color:var(--blue);font-weight:bold}.note{font-size:11px;color:var(--muted);line-height:1.5}.dashboard{min-height:100vh}.dash-wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}.side{background:var(--navy);padding:22px 14px;color:white}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dce8f4;padding:12px;border-radius:9px;margin:3px 0}.side button:hover{background:#ffffff1a}.dash-content{padding:28px}.dash-content h2{color:var(--navy)}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tile,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.tile small{color:var(--muted)}.tile strong{display:block;font-size:24px;margin-top:7px;color:var(--navy)}.panel{margin-top:15px}.panel p{font-size:13px;line-height:1.6;color:var(--muted)}@media(max-width:780px){.hero{grid-template-columns:1fr}.features{grid-template-columns:repeat(2,1fr)}.dash-wrap{grid-template-columns:1fr}.side{display:none}.tiles{grid-template-columns:1fr 1fr}}@media(max-width:480px){main{padding:20px 13px 35px}.roles{gap:8px}.role{padding:13px 10px}.features{gap:9px}.feature{padding:14px}.dash-content{padding:18px}.tiles{grid-template-columns:1fr}}
